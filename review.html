<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review & Rating - Private Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h2>Private Chat</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="games.html">Games</a>
      <a href="feed.html">Feed</a>
      <a href="users.html">Users</a>
      <a href="account.html">Account</a>
    </nav>
  </header>

  <main class="container">
    <!-- Dynamic Header Info (Image + Title) -->
    <div id="itemDetail" class="detail-header">
      <p id="loadingText">Loading details...</p>
    </div>

    <!-- Review Submission Form -->
    <section class="review-form">
      <h2>Leave a Review</h2>
      <form id="reviewForm">

        <div class="form-group">
          <label>Star Rating</label>
          <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5" required/><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"/><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"/><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"/><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1"/><label for="star1">★</label>
          </div>
        </div>

        <div class="form-group">
          <label for="comment">Comment</label>
          <textarea id="comment" class="form-textarea" placeholder="What did you think?" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Post Review</button>
      </form>
    </section>

    <!-- Member Reviews List -->
    <section>
      <h2>Member Reviews</h2>
      <div id="reviewsList">
        <!-- Reviews loaded here dynamically -->
      </div>
    </section>
  </main>

  <script>
    // 1. Initialize Supabase Client
    // Replace these values with your actual details from Supabase Dashboard -> Project Settings -> API
    const SUPABASE_URL = 'https://tpeqgjgeeyrepaijdcuj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZXFnamdlZXlyZXBhaWpkY3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzczMjMsImV4cCI6MjEwNDE1MzMyM30.YEAcpOlAiaFdYHniMZdzM684NYiF5fVPVXUaRGWraC4';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // 2. Read URL Parameters (?id=123&type=movie)
    const urlParams = new URLSearchParams(window.location.search);
    const itemId = urlParams.get('id');
    const itemType = urlParams.get('type'); // "movie" or "game"

    const TMDB_API_KEY = '564e6671b19d2797c76255a4aefc8ba6';
    const RAWG_API_KEY = '5c9b18c14a3e4704bda05dfa828ccd86';

    const itemDetail = document.getElementById('itemDetail');
    const reviewForm = document.getElementById('reviewForm');
    const reviewsList = document.getElementById('reviewsList');
    const submitBtn = document.getElementById('submitBtn');

    let currentItemTitle = '';
    let currentItemImage = '';

    // 3. Fetch Item Information
    async function loadItemDetails() {
      if (!itemId || !itemType) {
        itemDetail.innerHTML = '<p>No item selected.</p>';
        return;
      }

      try {
        if (itemType === 'movie') {
          const res = await fetch(`https://api.themoviedb.org/3/movie/${itemId}?api_key=${TMDB_API_KEY}`);
          const data = await res.json();
          currentItemTitle = data.title;
          currentItemImage = data.poster_path ? 'https://image.tmdb.org/t/p/w500' + data.poster_path : 'https://via.placeholder.com/200x300';
          renderDetails(currentItemTitle, currentItemImage, data.overview);
        } else if (itemType === 'game') {
          const res = await fetch(`https://api.rawg.io/api/games/${itemId}?key=${RAWG_API_KEY}`);
          const data = await res.json();
          currentItemTitle = data.name;
          currentItemImage = data.background_image || 'https://via.placeholder.com/200x300';
          renderDetails(currentItemTitle, currentItemImage, data.description_raw || '');
        }

        // Fetch existing reviews for this specific item
        fetchDatabaseReviews();
      } catch (err) {
        console.error(err);
        itemDetail.innerHTML = '<p>Error loading item details.</p>';
      }
    }

    function renderDetails(title, image, description) {
      itemDetail.innerHTML = `
        <img src="${image}" alt="${title}" class="detail-poster">
        <div class="detail-info">
          <h1>${title}</h1>
          <p>${description ? description.slice(0, 300) + '...' : 'No description available.'}</p>
        </div>
      `;
    }

   // 4. Fetch Reviews from Supabase
    async function fetchDatabaseReviews() {
      reviewsList.innerHTML = '<p>Loading reviews...</p>';

      const { data, error } = await db
        .from('reviews')
        .select('*')
        .eq('item_id', itemId)
        .eq('item_type', itemType)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Database Error:', error);
        reviewsList.innerHTML = '<p>Could not load reviews.</p>';
        return;
      }

      if (!data || data.length === 0) {
        reviewsList.innerHTML = '<p>No reviews yet. Be the first to leave one!</p>';
        return;
      }

      reviewsList.innerHTML = data.map(r => `
        <div class="review-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span class="review-author">${r.username}</span>
            <span style="color: #f59e0b;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
          </div>
          <p>${r.comment}</p>
          <small style="color: gray;">${new Date(r.created_at).toLocaleDateString()}</small>
        </div>
      `).join('');
    }

// 5. Submit New Review to Supabase
    reviewForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Ensure user profile is loaded from js/auth.js
      if (!currentUserProfile) {
        alert('You must be logged in to post a review.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Posting...';

      const rating = document.querySelector('input[name="rating"]:checked').value;
      const comment = document.getElementById('comment').value.trim();

      const { error } = await db.from('reviews').insert([
        {
          item_id: String(itemId),
          item_type: itemType,
          item_title: currentItemTitle,
          item_image: currentItemImage,
          username: currentUserProfile.username, // Automatically attached from Supabase Auth!
          rating: parseInt(rating),
          comment: comment
        }
      ]);

      submitBtn.disabled = false;
      submitBtn.textContent = 'Post Review';

      if (error) {
        console.error('Insert Error:', error);
        alert('Failed to post review. Check your network or configuration.');
        return;
      }

      reviewForm.reset();
      // Refresh the reviews list from Supabase
      fetchDatabaseReviews();
    });

    loadItemDetails();
  </script>
</body>
</html>
