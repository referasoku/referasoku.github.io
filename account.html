<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Media Vault</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase SDK & Auth Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <header>
    <h2>Media Vault</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="games.html">Games</a>
      <a href="feed.html">Feed</a>
      <a href="users.html">Users</a>
      <a href="account.html" class="active">Account</a>
    </nav>
  </header>

  <main class="container">
    <h1 id="profileHeader">My Profile</h1>
    <p style="margin-bottom: 2rem;">Manage and view submitted reviews.</p>

    <!-- Tab Selection -->
    <div class="tab-container" style="margin-bottom: 1.5rem;">
      <button class="tab-btn active" id="movieTabBtn" onclick="switchTab('movie')">Movie Reviews</button>
      <button class="tab-btn" id="gameTabBtn" onclick="switchTab('game')">Game Reviews</button>
    </div>

    <!-- Review Stream -->
    <div id="userReviewsList">
      <p>Loading reviews...</p>
    </div>
  </main>

  <script>
    let activeTab = 'movie';

    // Check if viewing another user's profile via query parameter (?user=Username)
    const urlParams = new URLSearchParams(window.location.search);
    const viewedUser = urlParams.get('user');

    async function initAccountPage() {
      // Determine target username: URL parameter OR currently logged-in user profile
      let targetUsername = viewedUser;

      if (!targetUsername && typeof currentUserProfile !== 'undefined' && currentUserProfile) {
        targetUsername = currentUserProfile.username;
      }

      if (targetUsername) {
        document.getElementById('profileHeader').textContent = `@${targetUsername}'s Profile`;
        fetchUserReviews(targetUsername);
      } else {
        document.getElementById('userReviewsList').innerHTML = '<p>User profile not found.</p>';
      }
    }

    function switchTab(type) {
      activeTab = type;
      document.getElementById('movieTabBtn').classList.toggle('active', type === 'movie');
      document.getElementById('gameTabBtn').classList.toggle('active', type === 'game');

      const targetUsername = viewedUser || (currentUserProfile ? currentUserProfile.username : null);
      if (targetUsername) {
        fetchUserReviews(targetUsername);
      }
    }

    async function fetchUserReviews(username) {
      const container = document.getElementById('userReviewsList');
      container.innerHTML = '<p>Loading reviews...</p>';

      const { data: reviews, error } = await db
        .from('reviews')
        .select('*')
        .eq('username', username)
        .eq('item_type', activeTab)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Fetch error:', error);
        container.innerHTML = '<p>Error loading reviews.</p>';
        return;
      }

      if (!reviews || reviews.length === 0) {
        container.innerHTML = `<p>No ${activeTab} reviews posted yet by @${username}.</p>`;
        return;
      }

      container.innerHTML = reviews.map(r => `
        <div class="review-card" style="display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1rem; background: var(--card-bg, #1e293b); padding: 1rem; border-radius: 8px;">
          ${r.item_image ? `<img src="${r.item_image}" alt="${r.item_title}" style="width: 70px; height: 100px; object-fit: cover; border-radius: 6px;">` : ''}
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem;">
              <h3 style="margin: 0;">${r.item_title}</h3>
              <span style="color: #f59e0b;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
            </div>
            <p style="margin: 0.5rem 0;">${r.comment}</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <small style="color: gray;">Posted ${new Date(r.created_at).toLocaleDateString()}</small>
              <a href="review.html?id=${r.item_id}&type=${r.item_type}" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem;">View Item Page →</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Wait for auth session initialization from js/auth.js
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initAccountPage, 300);
    });
  </script>
</body>
</html>
